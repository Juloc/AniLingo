name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AniLingo.sln
      - run: dotnet build AniLingo.sln --no-restore --configuration Release
      - name: Diagnose EF model snapshot
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          $HOME/.dotnet/tools/dotnet-ef migrations add __SnapshotSync \
            --project src/AniLingo.Web/AniLingo.Web.csproj \
            --startup-project src/AniLingo.Web/AniLingo.Web.csproj \
            --output-dir Data/Migrations \
            --configuration Release \
            --no-build
          echo '=== GENERATED MIGRATION ==='
          cat src/AniLingo.Web/Data/Migrations/*__SnapshotSync.cs
          echo '=== GENERATED SNAPSHOT ==='
          cat src/AniLingo.Web/Data/Migrations/AppDbContextModelSnapshot.cs
      - run: dotnet test AniLingo.sln --no-build --configuration Release
      - name: Validate single-container Compose
        run: |
          test "$(docker compose config --services)" = "anilingo"
          test "$(docker compose config --images)" = "ghcr.io/juloc/anilingo:latest"
      - name: Build Docker image
        run: docker build -f src/AniLingo.Web/Dockerfile -t ghcr.io/juloc/anilingo:${{ github.sha }} .
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/juloc/anilingo:${{ github.sha }} ghcr.io/juloc/anilingo:latest
          docker push ghcr.io/juloc/anilingo:${{ github.sha }}
          docker push ghcr.io/juloc/anilingo:latest
