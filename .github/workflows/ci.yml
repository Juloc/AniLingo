name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "clients/android/**"
      - "docs/ANDROID_CLIENTS.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths-ignore:
      - "clients/android/**"
      - "docs/ANDROID_CLIENTS.md"
      - ".github/workflows/android.yml"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Jularr.sln
      - run: dotnet build Jularr.sln --no-restore --configuration Release
      - run: dotnet test Jularr.sln --no-build --configuration Release
      - name: Validate single-container Compose
        run: |
          test "$(docker compose config --services)" = "jularr"
          test "$(docker compose config --images)" = "ghcr.io/juloc/jularr:latest"
          ! docker compose config | grep -q '/media/anime'
      - name: Build Docker image
        run: docker build -f src/Jularr.Web/Dockerfile -t ghcr.io/juloc/jularr:${{ github.sha }} .
      - name: Smoke test startup without NAS
        run: |
          docker run -d --name jularr-no-nas -p 127.0.0.1:18097:8080 ghcr.io/juloc/jularr:${{ github.sha }}
          trap 'docker rm -f jularr-no-nas >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18097/Account/Setup >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs jularr-no-nas
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/juloc/jularr:${{ github.sha }} ghcr.io/juloc/jularr:latest
          docker push ghcr.io/juloc/jularr:${{ github.sha }}
          docker push ghcr.io/juloc/jularr:latest

          if [ "${{ startsWith(github.event.head_commit.message, 'release:') }}" = "true" ]; then
            VERSION="$(dotnet msbuild src/Jularr.Web/Jularr.Web.csproj -nologo -getProperty:Version)"
            docker tag ghcr.io/juloc/jularr:${{ github.sha }} "ghcr.io/juloc/jularr:${VERSION}"
            docker push "ghcr.io/juloc/jularr:${VERSION}"
          fi

      - name: Create GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(dotnet msbuild src/Jularr.Web/Jularr.Web.csproj -nologo -getProperty:Version)"
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Jularr ${VERSION}" \
            --prerelease \
            --generate-notes
