name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AniLingo.sln
      - run: dotnet build AniLingo.sln --no-restore --configuration Release
      - run: dotnet test AniLingo.sln --no-build --configuration Release
      - name: Validate single-container Compose
        run: |
          test "$(docker compose config --services)" = "anilingo"
          test "$(docker compose config --images)" = "ghcr.io/juloc/anilingo:latest"
      - name: Build Docker image
        run: docker build -f src/AniLingo.Web/Dockerfile -t ghcr.io/juloc/anilingo:${{ github.sha }} .
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ghcr.io/juloc/anilingo:${{ github.sha }} ghcr.io/juloc/anilingo:latest
          docker push ghcr.io/juloc/anilingo:${{ github.sha }}
          docker push ghcr.io/juloc/anilingo:latest

          if [ "${{ startsWith(github.event.head_commit.message, 'release:') }}" = "true" ]; then
            VERSION="$(dotnet msbuild src/AniLingo.Web/AniLingo.Web.csproj -nologo -getProperty:Version)"
            docker tag ghcr.io/juloc/anilingo:${{ github.sha }} "ghcr.io/juloc/anilingo:${VERSION}"
            docker push "ghcr.io/juloc/anilingo:${VERSION}"
          fi

      - name: Create GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(dotnet msbuild src/AniLingo.Web/AniLingo.Web.csproj -nologo -getProperty:Version)"
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "AniLingo ${VERSION}" \
            --prerelease \
            --generate-notes
