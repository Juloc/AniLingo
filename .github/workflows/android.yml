name: Android

on:
  pull_request:
    paths:
      - "clients/android/**"
      - "design/player/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - "main"
    paths:
      - "clients/android/**"
      - "design/player/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        working-directory: clients/android
        run: >
          gradle --no-daemon --stacktrace
          :core-api:testDebugUnitTest
          :core-player:testDebugUnitTest

      - name: Lint
        working-directory: clients/android
        run: >
          gradle --no-daemon --stacktrace
          :app-mobile:lintDebug
          :app-tv:lintDebug
          :core-api:lintDebug
          :core-model:lintDebug
          :core-player:lintDebug
          :core-session:lintDebug
          :core-design:lintDebug

      - name: Build debug APKs
        working-directory: clients/android
        run: >
          gradle --no-daemon --stacktrace
          :app-mobile:assembleDebug
          :app-tv:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: anilingo-android-debug-apks
          if-no-files-found: error
          path: |
            clients/android/app-mobile/build/outputs/apk/debug/*.apk
            clients/android/app-tv/build/outputs/apk/debug/*.apk
