<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/brand/jularr-mark.svg" type="image/svg+xml">
  <title>Jularr · Offline</title>
  <style>
    /* Static page served by the service worker without the server, so it uses the Jularr brand
       default instead of the profile palette. */
    :root {
      color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --bg: #f4efe8; --surface: #fffdfa; --field: #f7f2ec; --border: #e3dbd2; --text: #1e1a18; --muted: #6d625b;
      --accent: #c8102e; --on-accent: #ffffff; --accent-soft: #f8e3e3; --accent-text: #a50d26;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141312; --surface: #1c1a19; --field: #23201f; --border: #34302e; --text: #f3efeb; --muted: #b3aaa4; --accent-soft: #3a1d1f; --accent-text: #ff8a8f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); padding: 24px; }
    main { width: min(760px, 100%); margin: 4vh auto 0; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--accent-text); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .eyebrow img { width: 28px; height: 28px; }
    .panel { padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
    h1 { margin: 8px 0; font-size: 30px; }
    p { color: var(--muted); line-height: 1.5; }
    .card { min-height: 300px; display: grid; place-items: center; text-align: center; gap: 10px; }
    .term { font-size: clamp(42px, 10vw, 76px); font-weight: 700; }
    .reading, .source { color: var(--muted); }
    details { width: 100%; }
    summary { list-style: none; cursor: pointer; width: fit-content; margin: 20px auto 0; }
    summary::-webkit-details-marker { display: none; }
    details[open] summary { display: none; }
    .answer { margin: 20px 0; font-size: 18px; }
    .context { padding: 14px; border-radius: 10px; background: var(--field); text-align: left; }
    .actions { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 14px; }
    button, summary { border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; background: var(--field); color: var(--text); font: inherit; font-weight: 800; }
    button { cursor: pointer; min-height: 48px; }
    button.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { body { padding: 14px; } .actions { grid-template-columns: repeat(2,1fr); } }
  </style>
  <script src="/js/offline-review.js" defer></script>
</head>
<body>
  <main data-offline-review-page>
    <section class="panel" data-offline-empty>
      <span class="eyebrow"><img src="/brand/jularr-mark.svg" alt="">Jularr offline</span>
      <h1>You are offline</h1>
      <p>If you opened Learn while online, your loaded review batch is available here. Ratings are stored only for that local account and sync when Jularr is reachable again.</p>
    </section>

    <section class="panel card" data-offline-card hidden>
      <span class="eyebrow">Offline review</span>
      <div class="term" lang="ja" data-offline-term></div>
      <div class="reading" lang="ja" data-offline-reading></div>

      <details>
        <summary>Show answer</summary>
        <div class="answer" data-offline-meaning></div>
        <div class="context" data-offline-context hidden>
          <p lang="ja" data-offline-sentence></p>
          <small class="source" data-offline-source></small>
        </div>
        <div class="actions">
          <button type="button" data-offline-rating="Again">Again</button>
          <button type="button" data-offline-rating="Hard">Hard</button>
          <button type="button" class="primary" data-offline-rating="Good">Good</button>
          <button type="button" data-offline-rating="Easy">Easy</button>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
