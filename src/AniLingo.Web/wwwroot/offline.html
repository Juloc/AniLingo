<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d11">
  <title>AniLingo · Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #090b0f; color: #f3f5f7; padding: 24px; }
    main { width: min(760px, 100%); margin: 4vh auto 0; }
    .eyebrow { color: #e7a91b; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .panel { padding: 24px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: #11141a; }
    h1 { margin: 8px 0; font-size: 30px; }
    p { color: #929aa8; line-height: 1.5; }
    .card { min-height: 300px; display: grid; place-items: center; text-align: center; gap: 10px; }
    .term { font-size: clamp(42px, 10vw, 76px); font-weight: 700; }
    .reading, .source { color: #929aa8; }
    details { width: 100%; }
    summary { list-style: none; cursor: pointer; width: fit-content; margin: 20px auto 0; }
    summary::-webkit-details-marker { display: none; }
    details[open] summary { display: none; }
    .answer { margin: 20px 0; font-size: 18px; }
    .context { padding: 14px; border-radius: 10px; background: #0d1015; text-align: left; }
    .actions { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 14px; }
    button, summary { border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 12px 14px; background: #181d25; color: #f3f5f7; font: inherit; font-weight: 800; }
    button { cursor: pointer; min-height: 48px; }
    button.primary { border-color: rgba(231,169,27,.5); background: rgba(231,169,27,.12); color: #f4c354; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { body { padding: 14px; } .actions { grid-template-columns: repeat(2,1fr); } }
  </style>
  <script src="/js/offline-review.js" defer></script>
</head>
<body>
  <main data-offline-review-page>
    <section class="panel" data-offline-empty>
      <span class="eyebrow">AniLingo offline</span>
      <h1>You are offline</h1>
      <p>If you opened Learn while online, your loaded review batch is available here. Ratings are stored only for that local account and sync when AniLingo is reachable again.</p>
    </section>

    <section class="panel card" data-offline-card hidden>
      <span class="eyebrow">Offline review</span>
      <div class="term" lang="ja" data-offline-term></div>
      <div class="reading" lang="ja" data-offline-reading></div>

      <details>
        <summary>Show answer</summary>
        <div class="answer" data-offline-meaning></div>
        <div class="context" data-offline-context hidden>
          <p lang="ja" data-offline-sentence></p>
          <small class="source" data-offline-source></small>
        </div>
        <div class="actions">
          <button type="button" data-offline-rating="Again">Again</button>
          <button type="button" data-offline-rating="Hard">Hard</button>
          <button type="button" class="primary" data-offline-rating="Good">Good</button>
          <button type="button" data-offline-rating="Easy">Easy</button>
        </div>
      </details>
    </section>
  </main>
</body>
</html>
