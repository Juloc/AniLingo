<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d11">
  <title>AniLingo · Offline</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b0f; color: #f3f5f7; padding: 24px; }
    main { width: min(520px, 100%); padding: 28px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: #11141a; }
    span { color: #e7a91b; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 30px; }
    p { color: #929aa8; line-height: 1.5; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; background: #e7a91b; color: #111; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <span>AniLingo</span>
    <h1>You are offline</h1>
    <p>The server cannot be reached. Media, account pages and private learning data are never stored in the shared PWA cache.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
