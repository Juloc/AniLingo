version: reader-theme-v1
theme: thriller/smoke
genre: thriller
variant: smoke
core_mood: >
  dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients
page: >
  Create a portrait reader background master, approximately 1600x2560, for a page-turn book mode. This is a reading-app background, not cover art and not a poster. No characters, no faces, no readable text, no typography, no logos and no UI. Keep the central 55% calm, low-contrast and uncluttered for body text. Push stronger detail toward the outer edges and corners. Keep top and bottom control zones visually quiet. No hard focal point in the center. Genre mood: dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients. Use a static elegant composition with subtle paper/material texture, gentle edge vignette and restrained framing. It must work for single-page and two-page spreads.
scroll_static: >
  Create a tall portrait reader background master, approximately 1600x3200, for continuous vertical scrolling. This is a reading-app background, not cover art and not a poster. No characters, no faces, no readable text, no typography, no logos and no UI. Keep the central 55% calm, low-contrast and uncluttered for body text. Push stronger detail toward the outer edges and corners. Keep top and bottom control zones visually quiet. No hard focal point in the center. Genre mood: dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients. Make the composition vertically spacious with no hard horizon through the reading area. Make top and bottom transitions seam-friendly so long scrolling/cropping does not reveal an obvious scene cut.
parallax_back: >
  Create the BACK layer of a 2.5D parallax reader background, approximately 1600x3200. This is a reading-app background, not cover art and not a poster. No characters, no faces, no readable text, no typography, no logos and no UI. Keep the central 55% calm, low-contrast and uncluttered for body text. Push stronger detail toward the outer edges and corners. Keep top and bottom control zones visually quiet. No hard focal point in the center. Genre mood: dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients. Use only distant atmosphere, broad haze, sky and far silhouettes. Lowest detail and lowest contrast of all layers. Make top and bottom vertically seam-friendly for repeating movement.
parallax_mid: >
  Create the MID layer of a 2.5D parallax reader background, approximately 1600x3200. This is a reading-app background, not cover art and not a poster. No characters, no faces, no readable text, no typography, no logos and no UI. Keep the central 55% calm, low-contrast and uncluttered for body text. Push stronger detail toward the outer edges and corners. Keep top and bottom control zones visually quiet. No hard focal point in the center. Genre mood: dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients. Use medium-depth environmental silhouettes and structures appropriate to the genre, mainly near edges. Keep the central reading zone open. Make top and bottom vertically seam-friendly for repeating movement.
parallax_front: >
  Create the FRONT layer of a 2.5D parallax reader background, approximately 1600x3200. This is a reading-app background, not cover art and not a poster. No characters, no faces, no readable text, no typography, no logos and no UI. Keep the central 55% calm, low-contrast and uncluttered for body text. Push stronger detail toward the outer edges and corners. Keep top and bottom control zones visually quiet. No hard focal point in the center. Genre mood: dark charcoal, muted deep red and smoky gray palette, subtle tension textures and shadow gradients. Use only sparse foreground edge details, particles, wisps or ornaments appropriate to the genre. Keep the central reading zone almost empty. Transparent background is preferred when supported. Make vertical movement/repetition visually safe.
