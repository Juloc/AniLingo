reason: "Epoch 4 moves Jularr's canonical database from SQLite to PostgreSQL (EF Core/Npgsql, #570). Fresh installs get a single squashed PostgreSQL baseline (Data/Migrations Epoch4PostgresBaseline). A supported existing installation upgrades once: the SQLite database from Epoch 3 (the EF-baseline SQLite epoch) is imported into PostgreSQL by SqliteToPostgresImporter at startup (or an operator-run pass), which copies every table in FK order with value conversion, then renames the legacy file. Epoch 2 (pre-EF SQLite) is no longer imported directly: bridge it to Epoch 3 on a pre-#570 SQLite build first, then upgrade to Epoch 4. The SQLite-specific migration bridge and the legacy UserTerms/Reviews learning conversion were retired with this cutoff; that data arrives already-converted through the Epoch 3 SQLite import."
