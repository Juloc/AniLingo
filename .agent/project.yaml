project: Jularr
repository: Juloc/Jularr
coordination:
  repository: Juloc/agent-control
  issue: 1
  hubUrl: null
relatedRepositories:
  - Juloc/agent-control
validation:
  - dotnet restore Jularr.sln
  - dotnet build Jularr.sln --no-restore
  - dotnet test Jularr.sln --no-build
protectedPaths:
  - AGENTS.md
  - .agent/project.yaml
notes:
  - "Branch workflow: agents commit and push directly to the unprotected dev branch (no PR per change). main stays protected; dev is promoted to main by one PR. Releases and publishing run only from main."
  - GitHub is the durable source of truth.
  - Keep Jularr a modular monolith; do not introduce microservices or duplicate state/configuration paths.
  - Razor Pages are page boundaries; shared UI belongs in reusable components/partials.
  - Prefer focused tests for parsing, scanning, aggregation and scheduling behavior rather than trivial plumbing.
